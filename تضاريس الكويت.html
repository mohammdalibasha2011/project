/* Layout: category list on the inline-start side, a pannable sea-and-sand map beside it; markers pop in when a category is switched on. */
:root{
  --font-display:'Reem Kufi','IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  --font-ui:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;

  --accent:#1c5b77; --accent-ink:#ffffff;

  --sea:#b5cfdb; --shelf:#cfe3ec; --land-out:#ddd7c7; --land-in:#f1ecdc; --coast:#7f98a2;
  --border:#b02f29; --geo:#6b6b5b; --halo:#f6f2e6; --label:#1a2a31; --grid:#6b7b82; --frame:#34454d;

  --c-plateau:#1b1b1b; --c-hills:#2d4aa8; --c-plains:#25995a; --c-valleys:#d3208a;

  --c-khors:#4a5a64; --khor-stroke:#2b3a43; --c-bays:#c8312e;

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){

    --accent:#74c3e0; --accent-ink:#082029;
    --sea:#1a3340; --shelf:#244352; --land-out:#262a27; --land-in:#383b32; --coast:#5f8291;

    --c-khors:#b7c6ce; --khor-stroke:#0f1a20; --c-bays:#ff7a74;

  --bg:#0e181d; --panel:#15242b; --fg:#e7eff2; --muted:#9bb0ba; --line:#28404b;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.5}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{
  max-width:1260px;margin:0 auto;
  padding-block:20px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px;align-items:start;
}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}

/* panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
h1{margin:0;font:700 27px/1.2 var(--font-display);text-wrap:balance}
.lead{margin:6px 0 0;color:var(--muted);font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:600 13.5px var(--font-ui);padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.switch{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer;width:fit-content}
.switch input{width:17px;height:17px;accent-color:var(--accent);margin:0}

.group{display:flex;flex-direction:column;gap:8px}
.group h2{margin:0 0 2px;font:600 13px var(--font-ui);color:var(--muted)}
.cat-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);font:600 15px var(--font-ui);cursor:pointer;text-align:start}
.cat-btn:hover{border-color:var(--cc)}
.cat-btn[aria-pressed="true"]{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 13%,var(--panel))}
.cat-btn .sym{display:grid;place-items:center;width:30px;height:26px;flex:none;--halo:var(--panel)}
.cat-btn .sym svg{width:26px;height:24px;display:block}
.cat-btn .nm{flex:1;min-width:0}
.cat-btn .cnt{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted);background:var(--bg);border-radius:999px;padding:1px 9px}
.names{list-style:none;margin:6px 16px 4px;padding:0 10px 0 0;padding-inline:10px 0;border-inline-start:2px solid var(--cc);display:flex;flex-direction:column;gap:1px}
.item{width:100%;text-align:start;border:0;background:transparent;color:var(--muted);font:500 14px var(--font-ui);padding:5px 8px;border-radius:6px;cursor:pointer}
.item:hover,.item:focus-visible{color:var(--fg);background:var(--bg)}
.status{margin:0;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

/* map */
.mapwrap{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--sea);overflow:hidden;min-width:0}
.scroller{overflow:auto;direction:ltr;max-height:min(82vh,820px)}
.scroller.pannable{cursor:grab}
.scroller.dragging{cursor:grabbing;user-select:none}
#map{display:block;width:100%;height:auto;max-width:none;user-select:none;-webkit-user-select:none}
.zoom{position:absolute;top:10px;inset-inline-end:14px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 19px/1 var(--font-ui);cursor:pointer;display:grid;place-items:center;padding:0}
.zbtn:hover:not(:disabled){border-color:var(--accent)}
.zbtn:disabled{opacity:.4;cursor:default}
.hint{position:absolute;inset-inline:0;bottom:16px;margin:0;display:flex;justify-content:center;pointer-events:none;z-index:2}
.hint span{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:13.5px;color:var(--fg);max-width:calc(100% - 32px);text-align:center}

/* svg text */
.geo{font:500 16px var(--font-ui);fill:var(--geo)}
.geo.sm{font-size:13.5px}
.tick{font:600 9.5px var(--font-ui);fill:var(--muted)}
.lbl{font:600 11.5px var(--font-ui);fill:var(--label);paint-order:stroke;stroke:var(--halo);stroke-width:3.2px;stroke-linejoin:round;transition:opacity .25s}

/* features */
.feat{opacity:0;pointer-events:none;transition:opacity .25s ease}
.feat.on{opacity:1;pointer-events:auto;cursor:pointer;transition-delay:var(--d,0s)}
.feat .pop{transform-box:fill-box;transform-origin:center;transform:scale(.2);transition:transform .45s cubic-bezier(.2,1.4,.4,1)}
.feat.on .pop{transform:scale(1);transition-delay:var(--d,0s)}
.feat .ring{fill:none;stroke:var(--accent);stroke-width:2.2;opacity:0;transition:opacity .15s}
.feat.hl .ring{opacity:1}
.nolabels .feat:not(.peek) .lbl{opacity:0}
@media (prefers-reduced-motion:reduce){
  .feat,.feat .pop,.lbl,.feat .ring{transition:none!important}
}
</style>

</div>

/* Catmull-Rom spline through points, as cubic Bezier segments (path must already be at pts[0]) */
function cr(pts,closed){
  var n=pts.length,d='',segs=closed?n:n-1,t=1/6;
  function at(i){return pts[((i%n)+n)%n];}
  for(var i=0;i<segs;i++){

/* names of neighbours and sea */

txt(gBase,'إيران',555,63,'geo',{'text-anchor':'middle'});
txt(gBase,'المملكة العربية السعودية',150,382,'geo sm',{'text-anchor':'middle'});

/* frame, ticks, coordinates */

/* ---------- features ---------- */
var moved=false;
CATS.forEach(function(c){
  c.items.forEach(function(it){
    var g=mk('g',{'class':'feat',id:'f-'+it.id,transform:'translate('+it.x+' '+it.y+')'},gFeats);
    g.style.setProperty('--cc','var('+c.color+')');
    var hit=c.shape==='hatch'
      ?'<rect class="hit" x="-23" y="-12" width="46" height="24" fill="transparent"/><rect class="ring" x="-23" y="-12" width="46" height="24" rx="9"/>'
      :'<circle class="hit" r="14" fill="transparent"/><circle class="ring" r="13.5"/>';
    g.innerHTML='<title>'+it.n+'</title>'+hit+'<g class="pop">'+marker(c.shape)+'</g>';
    var dx=it.lx-it.x,dy=it.ly-it.y;
    var t=mk('text',{x:dx,y:dy,'text-anchor':it.a,'class':'lbl'},g);
    if(it.rot){t.setAttribute('transform','rotate('+it.rot+' '+dx+' '+dy+')');}
    t.textContent=it.n;
    g.addEventListener('click',function(){
      if(moved){return;}
      g.classList.toggle('peek');
    });
  });
});

/* ---------- panel ---------- */
var groupsEl=$('#groups'),statusEl=$('#status'),hint=$('#hint'),active={};
GROUPS.forEach(function(gr){
  var sec=document.createElement('section');
  sec.className='group';
  sec.innerHTML='<h2>'+gr.title+'</h2>';
  gr.cats.forEach(function(id){
    var c=CM[id];
    var row=document.createElement('div');
    row.className='cat';
    row.setAttribute('data-cat',id);
    row.style.setProperty('--cc','var('+c.color+')');
    row.innerHTML=
      '<button type="button" class="cat-btn" aria-pressed="false" aria-controls="list-'+id+'">'+
        '<span class="sym"><svg viewBox="-12 -11 24 22" aria-hidden="true">'+iconMarker(c.shape)+'</svg></span>'+
        '<span class="nm">'+c.name+'</span><span class="cnt">'+toAr(c.items.length)+'</span></button>'+
      '<ul class="names" id="list-'+id+'" hidden>'+
        c.items.map(function(it){return '<li><button type="button" class="item" data-f="'+it.id+'">'+it.n+'</button></li>';}).join('')+
      '</ul>';
    sec.appendChild(row);
  });
  groupsEl.appendChild(sec);
});

function update(){
  var n=0;
  Object.keys(active).forEach(function(id){if(active[id]){n+=CM[id].items.length;}});
  statusEl.textContent=n
    ?'يظهر '+toAr(n)+' من '+toAr(TOTAL)+' معلماً على الخريطة'
    :'الخريطة فارغة · '+toAr(TOTAL)+' معلماً بانتظار الإظهار';
  hint.hidden=n>0;
}
function setCat(id,on){
  active[id]=on;
  var row=document.querySelector('.cat[data-cat="'+id+'"]');
  row.querySelector('.cat-btn').setAttribute('aria-pressed',on?'true':'false');
  row.querySelector('.names').hidden=!on;
  CM[id].items.forEach(function(it,i){
    var f=document.getElementById('f-'+it.id);
    f.style.setProperty('--d',(i*60)+'ms');
    f.classList.toggle('on',on);
    if(!on){f.classList.remove('peek','hl');}
  });
  update();
}

var scroller=$('#scroller'),mapwrap=$('#mapwrap');
function pulse(fid){
  var f=document.getElementById('f-'+fid),it=ITEMS[fid];
  if(!f||!f.classList.contains('on')){return;}
  f.classList.add('hl');
  if(scroller.scrollWidth>scroller.clientWidth+2||scroller.scrollHeight>scroller.clientHeight+2){
    var k=svg.clientWidth/724;
    scroller.scrollTo({left:(it.x+24)*k-scroller.clientWidth/2,top:it.y*k-scroller.clientHeight/2,behavior:'smooth'});
  }
  if(window.matchMedia('(max-width:860px)').matches){mapwrap.scrollIntoView({behavior:'smooth',block:'nearest'});}
  clearTimeout(f._t);
  f._t=setTimeout(function(){f.classList.remove('hl');},1800);
}
function setHl(fid,on){
  var f=document.getElementById('f-'+fid);
  if(f&&f.classList.contains('on')){f.classList.toggle('hl',on);}
}
groupsEl.addEventListener('click',function(e){
  var b=e.target.closest('.cat-btn');
  if(b){var id=b.parentNode.getAttribute('data-cat');setCat(id,!active[id]);return;}
  var it=e.target.closest('.item');
  if(it){pulse(it.getAttribute('data-f'));}
});
['mouseover','focusin'].forEach(function(ev){
  groupsEl.addEventListener(ev,function(e){var it=e.target.closest('.item');if(it){setHl(it.getAttribute('data-f'),true);}});
});
['mouseout','focusout'].forEach(function(ev){
  groupsEl.addEventListener(ev,function(e){var it=e.target.closest('.item');if(it){setHl(it.getAttribute('data-f'),false);}});
});
$('#btnAll').addEventListener('click',function(){CATS.forEach(function(c){setCat(c.id,true);});});
$('#btnClear').addEventListener('click',function(){CATS.forEach(function(c){setCat(c.id,false);});});
$('#chkLabels').addEventListener('change',function(e){svg.classList.toggle('nolabels',!e.target.checked);});

/* ---------- zoom and pan ---------- */
var Z=[1,1.6,2.4,3.4],zi=0,zIn=$('#zIn'),zOut=$('#zOut');
function applyZoom(){
  var cw=scroller.clientWidth,ch=scroller.clientHeight;
  var ow=svg.clientWidth||1,oh=svg.clientHeight||1;
  var fx=(scroller.scrollLeft+cw/2)/ow,fy=(scroller.scrollTop+ch/2)/oh;
  svg.style.width=Math.round(Math.max(cw,640)*Z[zi])+'px';
  scroller.scrollLeft=fx*svg.clientWidth-cw/2;
  scroller.scrollTop=fy*svg.clientHeight-scroller.clientHeight/2;
  scroller.classList.toggle('pannable',scroller.scrollWidth>cw+2||scroller.scrollHeight>scroller.clientHeight+2);
  zIn.disabled=zi===Z.length-1;
  zOut.disabled=zi===0;
}
zIn.addEventListener('click',function(){if(zi<Z.length-1){zi++;applyZoom();}});
zOut.addEventListener('click',function(){if(zi>0){zi--;applyZoom();}});
$('#zFit').addEventListener('click',function(){
  zi=0;applyZoom();
  scroller.scrollLeft=(scroller.scrollWidth-scroller.clientWidth)*0.45;
  scroller.scrollTop=0;
});
var rt;
window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(applyZoom,120);});

var drag=null;
scroller.addEventListener('pointerdown',function(e){
  if(e.pointerType!=='mouse'||e.button!==0){return;}
  drag={x:e.clientX,y:e.clientY,l:scroller.scrollLeft,t:scroller.scrollTop};
  moved=false;
});
window.addEventListener('pointermove',function(e){
  if(!drag){return;}
  var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>4){moved=true;}
  if(moved){
    scroller.classList.add('dragging');
    scroller.scrollLeft=drag.l-dx;
    scroller.scrollTop=drag.t-dy;
  }
});
window.addEventListener('pointerup',function(){
  drag=null;
  scroller.classList.remove('dragging');
  setTimeout(function(){moved=false;},0);
});

update();
applyZoom();
if(scroller.scrollWidth>scroller.clientWidth+2){
  scroller.scrollLeft=(scroller.scrollWidth-scroller.clientWidth)*0.45;
}
})();
</script>
